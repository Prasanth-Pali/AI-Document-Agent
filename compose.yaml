services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-7860}:7860"
    environment:
      GROQ_API_KEY: "${GROQ_API_KEY:?Set GROQ_API_KEY in .env}"
      APP_PASSWORD: "${APP_PASSWORD:-}"
      PORT: "7860"
    volumes:
      - uploads:/home/user/app/uploads
      - chroma_data:/home/user/app/chroma_db
      - embedding_cache:/home/user/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  uploads:
  chroma_data:
  embedding_cache:
